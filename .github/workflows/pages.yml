name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build gateway
        shell: bash
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="description" content="Observatório Público — dados eleitorais e atuação política com fontes verificáveis.">
            <title>Observatório Público</title>
            <style>
              :root{color-scheme:light;--ink:#18352f;--paper:#f4f1e8;--accent:#c9d99b}
              *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
              main{width:min(680px,calc(100% - 32px));padding:48px;border:1px solid #18352f33;border-radius:28px;background:#fff9;box-shadow:0 24px 70px #18352f18}
              small{letter-spacing:.14em;text-transform:uppercase}h1{font:700 clamp(2.4rem,8vw,5rem)/.95 Georgia,serif;margin:.4em 0}p{max-width:52ch}
              a{display:inline-block;margin-top:18px;padding:13px 20px;border-radius:999px;background:var(--ink);color:white;text-decoration:none;font-weight:700}
            </style>
          </head>
          <body>
            <main>
              <small>Dados públicos · fontes verificáveis</small>
              <h1>Observatório Público</h1>
              <p>Abrindo a plataforma completa com candidaturas, atuação pública, notícias e vínculos documentados.</p>
              <a id="open" href="https://observatorio-publico.versevee.chatgpt.site/">Abrir plataforma</a>
            </main>
            <script>
              (() => {
                const backend = "https://observatorio-publico.versevee.chatgpt.site";
                const prefix = "/observatorio-publico";
                const path = location.pathname.startsWith(prefix) ? location.pathname.slice(prefix.length) || "/" : "/";
                const target = backend + path + location.search + location.hash;
                document.getElementById("open").href = target;
                setTimeout(() => location.replace(target), 1200);
              })();
            </script>
          </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: https://logsyntra.github.io/observatorio-publico/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
