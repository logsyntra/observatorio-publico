name: Bootstrap repository source v2

on:
  push:
    paths:
      - bootstrap-source-v2.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Expand versioned source
        run: |
          unzip -o bootstrap-source-v2.zip
          rm bootstrap-source-v2.zip
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Observatório Público source"
          git push
