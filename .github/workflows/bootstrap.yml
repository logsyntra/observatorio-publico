name: Bootstrap repository source

on:
  push:
    paths:
      - bootstrap-source.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand versioned source
        run: |
          unzip -o bootstrap-source.zip
          rm bootstrap-source.zip
      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Observatório Público source"
          git push
